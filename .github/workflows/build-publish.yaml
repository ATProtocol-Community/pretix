name: Build & publish pretix image (cic)

# Builds the image from this fork's own root Dockerfile (nginx + gunicorn +
# celery, assets via `make production`) and publishes it to GHCR for the
# Dokploy stack in deploy/dokploy/compose.yml.
#
# Tags:
#   ghcr.io/atprotocol-community/pretix:<ref>-<12char-sha>   immutable, pin deploys
#   ghcr.io/atprotocol-community/pretix:<ref>               moving (e.g. `cic`)
#   ghcr.io/atprotocol-community/pretix:latest              version tags only
#
# Upstream builds its official images out-of-tree, so this workflow is ours; it
# mirrors the pattern used by ATProtocol-Community/aip.

on:
  push:
    branches:
      - cic
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        run: |
          SHA_SHORT=$(git rev-parse --short=12 "${{ github.sha }}")
          IMAGE=ghcr.io/atprotocol-community/pretix
          TAGS="${IMAGE}:${GITHUB_REF_NAME}-${SHA_SHORT}"
          TAGS="${TAGS},${IMAGE}:${GITHUB_REF_NAME}"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAGS="${TAGS},${IMAGE}:latest"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "Building ${TAGS}"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Deploy only after the image is in the registry: Dokploy's own GitHub
      # push webhook would fire before the build finishes and pull the previous
      # :cic image. Repo secret DOKPLOY_DEPLOY_WEBHOOK is the compose deploy
      # webhook (https://console.atproto.software/api/deploy/compose/<token>).
      - name: Trigger Dokploy deployment
        if: github.event_name == 'push' && github.ref_type == 'branch'
        env:
          DEPLOY_WEBHOOK: ${{ secrets.DOKPLOY_DEPLOY_WEBHOOK }}
        run: |
          if [ -z "$DEPLOY_WEBHOOK" ]; then
            echo "DOKPLOY_DEPLOY_WEBHOOK is not set; skipping deploy"
            exit 0
          fi
          curl -fsS -X POST "$DEPLOY_WEBHOOK" \
            -H 'Content-Type: application/json' \
            -H 'X-GitHub-Event: push' \
            -d "{\"ref\":\"${GITHUB_REF}\",\"repository\":{\"full_name\":\"${GITHUB_REPOSITORY}\"}}"
